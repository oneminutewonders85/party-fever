name: Supabase Keepalive
# Pings the database every 3 days so the free-tier project never hits the
# 7-day inactivity auto-pause. Runs on GitHub's schedule; costs nothing.

on:
  schedule:
    - cron: "0 6 */3 * *"   # 06:00 UTC every 3rd day (well inside the 7-day window)
  workflow_dispatch:         # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "Pinging Supabase keepalive..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Response code: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "Keepalive failed (expected 200, got $HTTP)"; exit 1
          fi
          echo "Keepalive succeeded."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
